

name: Build Vanguard Team APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract redesign package
        run: unzip -o Vanguard-Team-Redesign-v2.zip 'www/*' 'android-icons/*' -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply Vanguard launcher icon
        run: |
          RES="android/app/src/main/res"
          mkdir -p "$RES/values"
          for ICON_DIR in android-icons/mipmap-*; do
            NAME=$(basename "$ICON_DIR")
            mkdir -p "$RES/$NAME"
            cp -f "$ICON_DIR"/* "$RES/$NAME/"
          done
          if [ ! -f "$RES/values/colors.xml" ]; then
            echo '<resources><color name="ic_launcher_background">#29251D</color></resources>' > "$RES/values/colors.xml"
          elif ! grep -q 'name="ic_launcher_background"' "$RES/values/colors.xml"; then
            sed -i 's#</resources>#<color name="ic_launcher_background">#29251D</color></resources>#' "$RES/values/colors.xml"
          fi

      - name: Sync app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanguard-Team-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
